name: Build iOS app
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Verify iOS 26 SDK
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk"
          [[ "$sdk" == 26.* ]]
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test map parsing
        run: |
          swiftc Shared/Location.swift Shared/GeoHash.swift Shared/MapParser.swift Tests/ParserSmoke.swift -o parser-smoke
          ./parser-smoke
      - name: Test Google Maps short link
        run: |
          swiftc Shared/Location.swift Shared/GeoHash.swift Shared/MapParser.swift Shared/LinkResolver.swift Tests/LiveLinkSmoke.swift -o live-link-smoke
          ./live-link-smoke
      - name: Build unsigned app
        run: |
          xcodebuild -project GeoShare.xcodeproj -scheme GeoShare -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package app
        run: |
          mkdir -p payload/Payload
          cp -R build/Build/Products/Release-iphoneos/GeoShare.app payload/Payload/
          cd payload && zip -qr ../GeoShare-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GeoShare-unsigned-ipa
          path: GeoShare-unsigned.ipa
  test-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test link on iOS simulator
        run: |
          xcrun simctl list devices available
          xcodebuild -project GeoShare.xcodeproj -scheme GeoShare -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' -derivedDataPath build CODE_SIGNING_ALLOWED=NO test
