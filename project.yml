name: GeoShare
options:
  bundleIdPrefix: app.gwal3n
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  GeoShare:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gwal3n.geoshare
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/GeoShare.entitlements
    dependencies:
      - target: GeoShareShare
        embed: true
  GeoShareShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gwal3n.geoshare.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  GeoShareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOS
    dependencies:
      - target: GeoShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gwal3n.geoshare.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GeoShare:
    build:
      targets:
        GeoShare: all
    run:
      config: Debug
    test:
      targets:
        - GeoShareTests
